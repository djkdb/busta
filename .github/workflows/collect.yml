# BUSTA 실제 운행 기록 수집기
# - 20분마다(06:00~23:40 KST) TAGO 고속버스도착정보의 "도착완료" 편을 busta-data 브랜치에 쌓는다.
#   도착정보는 도착 후 잠깐만 남으므로 간격을 늘리면 기록을 놓친다.
# - 하루 한 번(04:30 KST) 오늘·내일 실제 시간표도 보관한다 (TAGO 는 며칠 치만 제공).
# 필요: 저장소 Settings → Secrets and variables → Actions 에 DATA_GO_KR_SERVICE_KEY
# 주의: schedule 트리거는 기본 브랜치(main)에 이 파일이 있어야 동작한다.
name: collect-observations

on:
  schedule:
    - cron: "*/20 21-23,0-14 * * *" # KST 06:00~23:40
    - cron: "30 19 * * *" # KST 04:30 시간표 보관
  workflow_dispatch:
    inputs:
      timetables:
        description: "시간표도 보관"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: collect-observations
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Check out data branch (create on first run)
        run: |
          if git ls-remote --exit-code --heads origin busta-data >/dev/null; then
            git fetch --depth=1 origin busta-data
            git worktree add -B busta-data store FETCH_HEAD
          else
            git worktree add --orphan -b busta-data store
          fi

      - name: Collect
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          WITH_TIMETABLES: ${{ github.event.schedule == '30 19 * * *' || inputs.timetables == true }}
        run: |
          if [ -z "$DATA_GO_KR_SERVICE_KEY" ]; then
            echo "::error::DATA_GO_KR_SERVICE_KEY secret is not set"; exit 1
          fi
          if [ "$WITH_TIMETABLES" = "true" ]; then
            npx tsx scripts/collect.ts --out store --timetables
          else
            npx tsx scripts/collect.ts --out store
          fi

      - name: Commit new data
        working-directory: store
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No new data"; exit 0
          fi
          git -c user.name="busta-collector" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "data: collect $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M') KST"
          git push origin busta-data
